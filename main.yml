---
# Usage
# ansible-galaxy install -r requirements.yml -p roles
# ansible-navigator run --eei localhost/role-dev-ee -m stdout main.yml -i inventory/inventory.yml

- name: Create a webhost
  hosts: web_hosts
  gather_facts: true
  vars_files:
    - inventory/secrets.yml

  roles:
    - name: apigban.rhel-9.3-base
      vars:
        node_hostname: "{{ inventory_hostname }}"
        network:
          - name: ens18
            ipv4_address: "{{ ansible_host }}/24"
            type: ethernet
            ip:
              gateway4: "172.21.5.1"
    - name: devsec.hardening.os_hardening
    - name: apigban.devbox-role
    - name: apigban.hugo_webhost

- name: Configure Caddy Reverse Proxy
  hosts: dmz01
  gather_facts: true
  become: true
  vars_files:
    - inventory/secrets.yml

  tasks:
    - name: Preflight - fail loudly unless every Caddyfile secret is a real vaulted value
      ansible.builtin.assert:
        that:
          - namecheap_email is defined and namecheap_email | length > 0 and namecheap_email != 'XXXXXXXXXXXXXXXXX'
          - namecheap_api_key is defined and namecheap_api_key | length > 0 and namecheap_api_key != 'XXXXXXXXXXXXXXXXX'
          - namecheap_user is defined and namecheap_user | length > 0 and namecheap_user != 'XXXXXXXXXXXXXXXXX'
          - namecheap_client_ip is defined and namecheap_client_ip | length > 0 and namecheap_client_ip != 'XXXXXXXXXXXXXXXXX'
          - crowdsec_api_key is defined and crowdsec_api_key | length > 0 and crowdsec_api_key != 'XXXXXXXXXXXXXXXXX'
        fail_msg: >-
          inventory/secrets.yml is missing real values for the Caddy secrets.
          Copy inventory/secrets.yml.sample, fill in the real values, encrypt the
          whole file with ansible-vault, and run again with --vault-id
          (see RUNBOOK.md). NEVER run this playbook with the sample placeholders:
          Caddy would be rendered with broken keys.

    - name: Ensure Caddy configuration directory exists
      ansible.builtin.file:
        path: "{{ caddy_etc_path }}"
        state: directory
        mode: '0755'

    - name: Deploy Caddy reverse proxy configuration
      ansible.builtin.template:
        src: Caddyfile-dmz.j2
        dest: "{{ caddy_etc_path }}/Caddyfile"
        owner: contsvc
        group: contsvc
        mode: '0640'
        force: true
      notify: Reload Caddy

    - name: Validate rendered Caddyfile inside the caddy container before reload
      become_user: contsvc
      ansible.builtin.command:
        cmd: /usr/bin/podman exec caddy caddy validate --config /etc/caddy/Caddyfile
      changed_when: false

    - name: Purge plaintext-key Caddyfile fossils from the caddy volume
      ansible.builtin.file:
        path: "{{ caddy_etc_path }}/{{ item }}"
        state: absent
      loop: "{{ caddy_caddyfile_fossils }}"

    - name: Reload caddy only if the validated config changed
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload Caddy
      become: true
      become_user: contsvc
      ansible.builtin.command:
        cmd: /usr/bin/podman restart caddy
