---
packages:
  - firewalld
  - iotop
  - tmux
  - qemu-guest-agent
  - vim
  - git
  - container-tools
  - epel-release

site_name: alain.apigban.com
repo_url: https://github.com/apigban/{{ site_name }}.git
site_path: /home/ansible/sites/{{ site_name }}


web_path: /var/www/html
caddy_etc_path: /home/contsvc/.local/share/containers/storage/volumes/caddy_etc/_data

hugo:
  commands:
    - /usr/local/bin/hugo mod get -u 
    - /usr/local/bin/hugo mod tidy
    - /usr/local/bin/hugo mod npm pack
    - npm install
    - /usr/local/bin/hugo

sites:
  - name: alain.apigban.com
    local_path: /var/www/html
    repo_url: https://github.com/apigban/alain.apigban.com.git
    port: 10000

# Runner egress boundary knobs on dmz01 (apigban/dmz01#13; see runner-egress.yml
# and docs/runner-egress-decision.md). Implementation-detail vars (protected
# accounts, DNS carve-outs, block ranges, nft paths) stay in the play.
#   runner_egress_enforce:
#     false (default) -> AUDIT: counters + rate-limited kernel log only,
#       NOTHING is dropped. Watch `nft list chain inet runner_egress
#       runner_policy` and `journalctl -k --grep 'egress-audit'` first.
#     true -> ENFORCE: internal-bound traffic from the runner user is dropped.
#       Promote only after the audit pass (decision doc, section 9).
#   runner_egress_state: present (default) | absent (removes the boundary
#     entirely).
runner_egress_enforce: false
runner_egress_state: present